apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crunchy-postgres-instance
  namespace: test-db
spec:
  destination:
    namespace: openshift-gitops
    server: 'https://kubernetes.default.svc'
  project: cluster-config
  source:
    path: components/apps/operators/crunchy-postgres-operator/instance/overlays/test-db
    repoURL: https://github.com/turbra/cluster-config.git
    targetRevision: lab
  syncPolicy:
    automated:
      selfHeal: true
      prune: true